name: CI

# main only receives pull requests from dev. The ruleset on main requires the "build" check, so pull requests run
# without a path filter: a skipped required check would block the merge. Pushes to main run too: only runs on the
# default branch write the Gradle cache that pull requests can read.
on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Restores dependencies and the build cache (unchanged modules skip their tests). main and dev write it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
      - name: Build and test
        run: ./gradlew build --console=plain
