<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="AimTune: find the mouse sensitivity you aim best with">
  <defs>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D31"/><stop offset="1" stop-color="#0A0B0C"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.22"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ECEDEE" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .ui { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, Menlo, "Courier New", monospace; }
  </style>
  <rect width="1280" height="360" rx="16" fill="#121314"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)"/>

  <!-- left module: brand -->
  <rect x="24" y="24" width="600" height="312" rx="16" fill="url(#bevel)"/>
  <rect x="25" y="25" width="598" height="310" rx="15" fill="#1B1D1F"/>
  <circle cx="84" cy="96" r="22" fill="none" stroke="#FFB020" stroke-width="4"/>
  <circle cx="84" cy="96" r="7" fill="#FFB020"/>
  <text x="122" y="112" class="ui" font-size="46" font-weight="600" fill="#ECEDEE">AimTune</text>
  <text x="62" y="176" class="ui" font-size="24" fill="#ECEDEE">Find the mouse sensitivity you aim best with.</text>
  <text x="62" y="210" class="ui" font-size="18" fill="#9A9EA4">Blind rounds in a 3D aim trainer · Bayesian optimization</text>
  <text x="62" y="236" class="ui" font-size="18" fill="#9A9EA4">Result in your game's value and in cm/360°</text>
  <g class="ui" font-size="14" fill="#C9CCD0">
    <rect x="62" y="270" width="132" height="34" rx="17" fill="#0D0E0F" stroke="#2A2D31"/>
    <circle cx="82" cy="287" r="5" fill="#3DDC97"/><text x="94" y="292">Blind test</text>
    <rect x="204" y="270" width="148" height="34" rx="17" fill="#0D0E0F" stroke="#2A2D31"/>
    <circle cx="224" cy="287" r="5" fill="#3DDC97"/><text x="236" y="292">Raw Input</text>
    <rect x="362" y="270" width="200" height="34" rx="17" fill="#0D0E0F" stroke="#2A2D31"/>
    <circle cx="382" cy="287" r="5" fill="#FFB020"/><text x="394" y="292">Raw Accel export</text>
  </g>

  <!-- right module: readout and score chart -->
  <rect x="648" y="24" width="608" height="312" rx="16" fill="url(#bevel)"/>
  <rect x="649" y="25" width="606" height="310" rx="15" fill="#1B1D1F"/>
  <text x="680" y="68" class="ui" font-size="15" font-weight="600" letter-spacing="1.5" fill="#ECEDEE">SENS</text>
  <circle cx="738" cy="63" r="5" fill="#3DDC97"/>
  <text x="752" y="68" class="ui" font-size="15" fill="#9A9EA4">Settled</text>
  <rect x="680" y="88" width="544" height="220" rx="10" fill="#0D0E0F"/>
  <text x="704" y="118" class="ui" font-size="13" fill="#9A9EA4">Recommended (sample)</text>
  <text x="702" y="188" class="mono" font-size="64" fill="#FFB020">38.4</text>
  <text x="862" y="188" class="mono" font-size="22" fill="#ECEDEE">cm/360°</text>
  <text x="704" y="218" class="mono" font-size="15" fill="#9A9EA4">range 34–43 · confidence 82%</text>
  <path d="M960 270 C1010 236 1060 140 1120 132 C1170 128 1190 170 1204 214 L1204 290 L960 290 Z" fill="url(#band)"/>
  <line x1="960" y1="290" x2="1204" y2="290" stroke="#ECEDEE" stroke-opacity="0.15"/>
  <line x1="1112" y1="118" x2="1112" y2="290" stroke="#FFD06B" stroke-dasharray="6 6" stroke-opacity="0.7"/>
  <path d="M960 262 C1010 230 1060 150 1112 140 C1165 132 1188 176 1204 206" fill="none" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/>
  <g fill="#ECEDEE" fill-opacity="0.75">
    <circle cx="975" cy="258" r="3.5"/><circle cx="1004" cy="226" r="3.5"/><circle cx="1036" cy="196" r="3.5"/>
    <circle cx="1068" cy="160" r="3.5"/><circle cx="1096" cy="150" r="3.5"/><circle cx="1124" cy="132" r="3.5"/>
    <circle cx="1150" cy="146" r="3.5"/><circle cx="1180" cy="168" r="3.5"/><circle cx="1198" cy="198" r="3.5"/>
  </g>
</svg>
