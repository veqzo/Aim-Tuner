accel.result.raw_accel_title=Raw Accel
accel.result.raw_accel_text=AimTune greift nie auf Raw Accel oder deine Spiele zu. Der Export schreibt eine settings.json; lege sie neben rawaccel.exe (die dortige ersetzen, vorher eine Kopie behalten) oder importiere sie in Raw Accel und wende sie dort an. Lass deine Sensitivity im Spiel, wie sie ist.
