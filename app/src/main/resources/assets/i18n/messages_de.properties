hub.set.rotation.name=Rotation
hub.set.rotation.what=Dreht jede Mausbewegung um einen Winkel, bevor sonst etwas passiert. Das hilft, wenn Hand, Griff oder Sensor gekippt sind und eine gerade Bewegung zur Seite leicht nach oben oder unten endet. Ein positiver Winkel dreht Bewegungen auf dem Bildschirm im Uhrzeigersinn.
hub.set.rotation.formula=x' = x × cos(Winkel) - y × sin(Winkel)    y' = x × sin(Winkel) + y × cos(Winkel)
hub.set.rotation.why=Eine Zielbewegung ist eine Bewegung zu einem neuen Ziel. AimTune misst den Winkel zwischen der Richtung der ersten Bewegung und der Richtung zum Ziel. Ist deine Hand gedreht, sind alle ersten Bewegungen um denselben Winkel gedreht, und die entgegengesetzte Rotation richtet sie wieder aus. Ein Wert wird nur empfohlen, wenn der Bereich 0° ausschließt und die Abweichung mindestens 1° beträgt. Der Bereich ist ein 95-%-Intervall.
hub.set.yx.name=Y/X-Verhältnis
hub.set.yx.what=Multipliziert jede vertikale Bewegung mit einem Faktor, sodass deine vertikale Sensitivity von der horizontalen abweicht. 1,00 heißt: beide sind gleich.
hub.set.yx.formula=y' = y × Verhältnis    (nach der Kurve)
hub.set.yx.why=Bei Zielen rechts und unterhalb vergleicht AimTune, wie weit deine erste Bewegung entlang der Achse ging und wie weit das Ziel war. Das übliche Unterschießen erster Bewegungen steckt in beiden und kürzt sich im Verhältnis heraus. Ein Wert wird nur empfohlen, wenn der Bereich 1,00 ausschließt und die Änderung mindestens 5 % beträgt.
hub.set.lr.name=L/R-Verhältnis
hub.set.lr.what=Multipliziert Bewegungen nach links mit einem Faktor, um eine Hand auszugleichen, die in eine Richtung weiter geht als in die andere. 1,00 heißt: links und rechts sind gleich.
hub.set.lr.formula=x' = x × Verhältnis    wenn x < 0 (links)
hub.set.lr.why=AimTune vergleicht, wie weit deine ersten Bewegungen bei Zielen rechts und links gingen, im Verhältnis zur Zieldistanz. Ein Wert wird nur empfohlen, wenn der Bereich 1,00 ausschließt und die Änderung mindestens 5 % beträgt.
hub.set.ud.name=U/D-Verhältnis
hub.set.ud.what=Multipliziert Bewegungen nach oben mit einem Faktor (zusätzlich zum Y/X-Verhältnis). 1,00 heißt: oben und unten sind gleich.
hub.set.ud.formula=y' = y × Verhältnis    wenn y < 0 (oben)
hub.set.ud.recommended=Keine Empfehlung. Die gemessene Zahl dient nur zur Information.
hub.set.ud.why=AimTune vergleicht deine ersten Bewegungen zu Zielen unterhalb und oberhalb, wie bei den anderen Verhältnissen, und zeigt die Zahl. Einen Wert empfiehlt es nicht.
hub.set.ud.not_measured=Zielbewegungen nach oben sind selten. Als die Prüfung mit der Streuung echter Hände lief, empfahl sie in 8 % der Fälle eine Änderung, obwohl alles in Ordnung war (Grenze: 5 %). Die Zahl kann also in die Irre führen, und AimTune macht daraus nie eine Empfehlung.
hub.set.snap.name=Angle Snapping
hub.set.snap.what=Rastet eine Bewegung auf die horizontale oder vertikale Achse ein, wenn ihre Richtung innerhalb des Winkels zu dieser Achse liegt. Das wird für jeden Maus-Report einzeln entschieden.
hub.set.snap.formula=Winkel < s: y' = 0        Winkel > 90° - s: x' = 0        (Winkel = Winkel des Reports zur Horizontalen)
hub.set.snap.recommended=0° (aus)
hub.set.snap.why=Bei 1000 Hz besteht ein Report nur aus ein bis zwei Counts, sein Winkel ist also meist Rundung, und das Snapping wirkt auf jeden einzelnen Report. Schon 5° entfernen einen großen Teil der vertikalen Counts, während du dich seitwärts bewegst. Ob diese Counts Drift oder Korrekturen waren, misst das Replay unten an deinen eigenen Runden.
hub.set.snap.not_measured=Ein Blindtest könnte die Wirkung nicht finden: Sie liegt unter dem, was Stufen mit 12 Runden erkennen. Das Replay schickt deine gespeicherten Bewegungen mit Snapping durch das Treibermodell, aber ohne Rückkopplung: Du hättest eine eingerastete Bewegung anders korrigiert.
hub.set.speed_cap.name=Eingabe-Geschwindigkeitsgrenze
hub.set.speed_cap.what=Begrenzt die Geschwindigkeit der Mausbewegung selbst: Eine schnellere Bewegung wird auf die Grenze heruntergerechnet, in Zoll pro Sekunde. 0 schaltet sie aus.
hub.set.speed_cap.formula=Geschwindigkeit = Bewegung × (1000 ÷ DPI) ÷ Report-Zeit        Bewegung = Bewegung × min(Geschwindigkeit, Grenze) ÷ Geschwindigkeit
hub.set.speed_cap.recommended=0 (aus)
hub.set.speed_cap.why=Eine Grenze unter deinen schnellsten Flicks kürzt genau die Bewegungen, auf die es am meisten ankommt; eine Grenze darüber bewirkt nichts. Deine eigenen Geschwindigkeiten stehen hier, sodass du siehst, ab wo eine Grenze greifen würde.
hub.set.speed_cap.not_measured=Eine Grenze verändert die Bewegung deiner Hand selbst, es gibt also nichts, wogegen man sie testen könnte: Sie kann nur Geschwindigkeit wegnehmen. Die Zahlen reichen AimTune, um „aus“ zu empfehlen.
hub.set.smoothing.name=Glättung
hub.set.smoothing.what=Drei optionale Mittelwerte, jeder mit einer Halbwertszeit in Millisekunden: Eingabeglättung (der Geschwindigkeit, die die Kurve sieht), Skalierungsglättung (des Multiplikators) und Ausgabeglättung (der Bewegung selbst). 0 schaltet eine aus.
hub.set.smoothing.formula=ein alter Wert zählt nach einer Halbwertszeit nur noch halb        Ausgabeglättung: die Ausgabebewegung wird über die Zeit gemittelt
hub.set.smoothing.recommended=0 für alle drei
hub.set.smoothing.why=Eingabe- und Skalierungsglättung machen den Multiplikator nur ruhiger, und was sie ändern, ist winzig. Die Ausgabeglättung verzögert jede Bewegung. Sie fügt Lag hinzu, und Lag schadet dem Zielen.
hub.set.smoothing.not_measured=Ein ruhigerer Multiplikator ändert den Score um etwa einen Punkt, weit weniger als das Rauschen von Runde zu Runde (Standardabweichung etwa 13), ein Blindtest findet also keinen Unterschied. Die Ausgabeglättung fügt Lag hinzu, ein bekannter Nachteil, der keinen Test braucht.
hub.set.stretch.name=Domain- und Range-Stretch
hub.set.stretch.what=Gewichtet den horizontalen gegen den vertikalen Teil einer Bewegung. Der Domain-Stretch ändert die Geschwindigkeit, die die Kurve sieht, der Range-Stretch, wie stark die Kurve wirkt, jeweils pro Achse. 1 und 1 heißt: kein Stretch.
hub.set.stretch.formula=Geschwindigkeit = (|x| × Domain x, |y| × Domain y) ÷ Report-Zeit        Multiplikator = 1 + (Kurve - 1) × Range-Gewicht
hub.set.stretch.recommended=1 und 1 (kein Stretch)
hub.set.stretch.why=Beide ändern nur, wie die Kurve den vertikalen Anteil einer Bewegung behandelt. Ohne Grund, oben und unten verschieden zu behandeln, halten gleiche Gewichte die Reaktion in jede Richtung gleich.
hub.set.stretch.not_measured=Der größte Teil deiner Bewegung liegt nahe an der Horizontalen, die Wirkung eines Stretchs liegt also unter dem, was AimTune mit einem Blindtest messen kann.
hub.set.component.name=Whole oder by component, Lp-Norm
hub.set.component.what=Whole: Die Kurve liest die gemeinsame Geschwindigkeit beider Achsen. By component: Jede Achse hat ihre eigene Geschwindigkeit und Kurve. Die Lp-Norm legt fest, wie beide Achsen zu einer Geschwindigkeit werden: 2 ist die normale Länge, 16 oder mehr der größere der beiden Werte.
hub.set.component.formula=Geschwindigkeit = (|x|^p + |y|^p)^(1/p)        p = 2: die normale Länge
hub.set.component.recommended=Whole, Lp-Norm 2
hub.set.component.why=Whole mit 2 gibt in jede Richtung dieselbe Reaktion, und die willst du beim Zielen. By component lässt diagonale Bewegung weniger beschleunigen als gerade Bewegung.
hub.set.component.not_measured=Die Modi unterscheiden sich nur bei diagonaler Bewegung, und Diagonalen sind ein kleiner Teil der gespeicherten Runden, die Wirkung liegt also unter dem, was ein Blindtest messen kann.
hub.set.polling.name=Polling-Rate und -Zeit
hub.set.polling.what=Raw Accel berechnet die Geschwindigkeit als Bewegung geteilt durch die Zeit zwischen Reports. Mit einer Polling-Rate und der Option „konstantes Zeitintervall“ nimmt es eine feste statt der gemessenen Zeit; minimale und maximale Zeit begrenzen die gemessene Zeit.
hub.set.polling.formula=Geschwindigkeit = Bewegung × (1000 ÷ DPI) ÷ Zeit        Zeit = gemessene Zeit zwischen Min und Max, oder 1000 ÷ Rate bei fester Zeit
hub.set.polling.recommended=Automatisch: Rate 0, konstantes Zeitintervall aus
hub.set.polling.why=Die gemessene Zeit ist das, wofür der Treiber gebaut ist. Eine feste Zeit glättet die Geschwindigkeit nur ein wenig, und ein falscher Wert verfälscht jede Geschwindigkeit, die die Kurve sieht.
hub.set.polling.not_measured=AimTune spielt deine Werte genau (das Treibermodell enthält sie), beurteilt sie aber nicht: Die Wirkung auf den Multiplikator liegt unter dem, was ein Blindtest messen kann.
hub.export.note=Die Datei kommt in den Export-Ordner, nie in den Ordner von Raw Accel selbst. Kopiere sie selbst hinüber und prüfe sie in Raw Accel. Mit „nicht blind getestet“ markierte Änderungen stammen aus deinen gespeicherten Runden, probiere sie also im Spiel aus, bevor du sie behältst.
accel.plan.title=Dein Stufenplan
accel.plan.stage=Stufe {0} von {1}: deine Kurve mit +{2} % Gain für schnelle Bewegungen, ab {3} in/s und ab {4} in/s voll.
accel.plan.sessions=Bisherige Sessions: {0} auf deiner Kurve, {1} auf dieser Stufe.
accel.plan.start=Spiel diese Stufe in einigen Sessions an verschiedenen Tagen. Die App vergleicht, wie sich deine Fehler und dein Score gegenüber deiner eigenen Kurve entwickeln.
accel.plan.advance=Du bist zu dieser Stufe aufgestiegen, weil sich deine Hand an die vorige gewöhnt hat und dein Score nicht unter deinen eigenen gefallen ist.
accel.plan.back=Die letzte Stufe hat nicht zu deiner Hand gepasst, der Plan ist zurückgegangen.
accel.plan.top=Das ist die letzte Stufe des Plans. Sie ist das Ergebnis: behalte sie oder geh zurück auf deine eigene Kurve.
accel.plan.hold.rounds=Auf dieser Stufe gibt es noch nicht genug Runden; spiel eine volle Kalibrierung.
accel.plan.hold.sessions=Spiel mindestens zwei Sessions auf dieser Stufe, mit mindestens acht Stunden Abstand.
accel.plan.hold.baseline=Spiel zwei weitere Sessions auf der Stufe davor (deiner eigenen Kurve), damit dein Score einen Vergleich hat.
accel.plan.hold.adapting=Deine Hand gewöhnt sich noch an diese Stufe, oder dein Score liegt unter deinem eigenen. Spiel sie weiter.
accel.plan.ended=Der Plan ist auf deine eigene Kurve zurückgegangen. Eine neue Stufe entsteht mit einer neuen Analyse.
accel.plan.hint=Die Schwellen dieses Plans sind ungetestet. Er ändert nie von allein deine Dateien: du entscheidest, was du exportierst.
accel.plan.play=Stufe {0} spielen
