accel.result.draft_worse_note=Im Blindtest deutlich schlechter als deine eigene Kurve. Du kannst diese Stufe trotzdem als Kopie deiner Datei speichern; unser Rat ist, bei deiner Kurve zu bleiben oder erst mehr Sessions zu spielen.
