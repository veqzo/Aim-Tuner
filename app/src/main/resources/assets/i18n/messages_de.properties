accel.draft.title=Entwurf aus deinem Bewegungsprofil
accel.draft.felt=Stufe 1: deine Kurve mit +{0} % Gain für deine schnellen Bewegungen, ab {1} in/s beginnend und ab {2} in/s voll. Darunter bleibt deine Kurve unverändert.
accel.draft.felt_none=Ein spürbarer Schritt (mindestens +8 % für deine schnellen Bewegungen) ist mehr, als die Streuung deiner ersten Bewegungen zulässt (höchstens +{0} %). Ein kleinerer Schritt wäre kaum zu spüren, deshalb wird keiner angeboten.
accel.draft.felt_span=Deine Bewegungen sind sich in der Geschwindigkeit zu ähnlich, um schnell von langsam zu trennen. Deshalb wird kein Schritt angeboten.
accel.draft.basis_weaker=Deine ersten Bewegungen sprechen für einen schwächeren Anstieg, als deine Kurve hat (Schätzung x{0}).
accel.draft.hint=Der Schritt ist aus deiner Bewegung gezeichnet und nicht als dein bester Wert gemessen. Dass etwa 8 % spürbar sind, ist eine Annahme. Spiel einige Sessions mit Stufe 1, bevor du weitergehst.
