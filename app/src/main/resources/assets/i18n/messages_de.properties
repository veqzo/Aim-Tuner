accel.title=Kurve finden
accel.needs_raw_input=Die verwendete Mauseingabe ({0}) stempelt nicht jeden Report einzeln, daher lässt sich die Geschwindigkeit deiner Bewegungen für die Beschleunigung nicht gut genug messen. Beschleunigung braucht Windows Raw Input, das unter Windows der Standard ist.
accel.intro=Manche Spieler zielen besser, wenn die Sensitivity von der Handgeschwindigkeit abhängt. Empfohlen ist eine Blind-Suche: In etwa {0} Runden spielt AimTune verschiedene Kurvenstärken (darunter auch gar keine Kurve) mit deiner Sensitivity, ohne dir zu sagen welche, findet die Stärke, mit der du am besten triffst, und testet sie dann blind gegen die normale Sensitivity. Der andere Weg analysiert zuerst in {1} normalen Runden, wie deine ersten Bewegungen danebengehen; das findet nur große Vorlieben. Die Kurve wird hier nur simuliert; ist sie klar besser, kannst du eine Settings-Datei für Raw Accel exportieren.
accel.start_calibration=Zuerst meine Fehler analysieren
accel.baseline_none=Noch kein Setup
accel.baseline_none_help=Schließe zuerst das Setup ab, damit es eine Spiel-Sensitivity zum Spielen gibt.
accel.baseline_game=Deine Spiel-Sensitivity. Kurvendurchläufe werden damit gespielt, eine Kurve wird also dort beurteilt, wo du wirklich spielst.
accel.baseline_finder=Das Ergebnis des Finders ({0} Runden, {1} %).
accel.use_finder=Stattdessen mit dem Ergebnis des Finders spielen: {0} cm/360° · {1} {2} ({3} Runden, {4} %)
accel.use_finder_help=Nur angeboten, weil der Finder mindestens {0} % sicher ist. Ausgeschaltet nutzen die Kurvendurchläufe deine Spiel-Sensitivity.
accel.use_prior=Auf früheren Suchrunden aufbauen ({0})
accel.use_prior_help=Eingeschaltet spielt eine neue Suche weniger Runden und startet bei dem, was die früheren gefunden haben. Schalte es aus, um den ganzen Stärkebereich neu von vorn zu probieren; es wird nichts gelöscht.
accel.use_own=Gegen meine eigene Kurve analysieren: {0}
accel.use_own_help=Die Kalibrierungsrunden spielen die im Hub importierte Kurve und die Analyse rechnet sie heraus. Ein Vorschlag geht so von deiner Kurve aus und nicht von einer linearen Maus. Raw Accel muss im Treiber trotzdem aus sein: die App wendet die Kurve selbst an. Die Stärkesuche spielt deine Kurve mit einem Anstieg zwischen der Hälfte und dem Doppelten.
accel.own_dpi_mismatch=Deine importierte Kurve ({0}) wurde für {1} DPI gemacht, die Einstellungen sagen {2}. Sie wird nicht genutzt, weil sie bei anderen Geschwindigkeiten wirken würde als im Spiel.
accel.own_dpi_unset=Deine importierte Kurve ({0}) hat keine Geräte-DPI gesetzt. Sie wird nicht genutzt, weil ihre Geschwindigkeiten nicht zum Spiel passen würden.
accel.own_refused=Deine importierte Kurve ({0}) lässt sich im Trainer nicht exakt abspielen und wird deshalb nicht genutzt.
accel.windows_on=Die Windows-Zeigerbeschleunigung ist an; schalte sie aus, sie würde die Kalibrierung verfälschen.
accel.between.calibration=Kalibrierung
accel.between.test=Blindtest der Kurve
accel.between.round_done=Runde {0} abgeschlossen
accel.between.prior=Dazu zählen {0} Runden von früheren Tagen mit dieser Sensitivity, deshalb sind weniger neue Runden nötig.
accel.between.prior_search=Dazu zählen {0} Runden früherer Suchen mit dieser Sensitivity, deshalb sind weniger neue Runden nötig.
accel.between.progress_calibration={0} von {1} Kalibrierungsrunden
accel.between.progress_test={0} von bis zu {1} Runden, Paare aus normal und Kurve
accel.between.explain_calibration=Spiele wie gewohnt mit deiner empfohlenen Sensitivity. Die Runden mischen Flicks, kleine Anpassungen und Zielwechsel, denn die Kurve wird danach beurteilt, wie deine ersten Bewegungen bei verschiedenen Geschwindigkeiten danebengehen. Ab {0} Runden kannst du früher auswerten; mehr Runden machen das Ergebnis zuverlässiger.
accel.between.explain_test=Jedes Paar hat eine Runde mit deiner normalen Sensitivity und eine mit der Kurve, in zufälliger Reihenfolge und mit identischen Zielen. Dir wird nicht gesagt, welche welche ist. Der Test endet, sobald das Ergebnis klar ist, oder nach {0} Paaren.
